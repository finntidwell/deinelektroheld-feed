name: Feed aktualisieren
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_feed.py
        env:
          CONNECTIVO_EMAIL: ${{ secrets.CONNECTIVO_EMAIL }}
          CONNECTIVO_PW: ${{ secrets.CONNECTIVO_PW }}
      - run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.csv
          git diff --staged --quiet || git commit -m "Feed Update"
          git push
